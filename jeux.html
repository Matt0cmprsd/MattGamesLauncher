<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeux | Matt Games</title>
<link rel="icon" href="images/LogoMattGames.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">
      <img src="images/LogoMattGames.png" alt="Matt Games">
      <span class="brand-name">MATT GAMES</span>
    </a>
    <nav class="nav">
      <a href="index.html">Accueil</a>
      <a href="jeux.html" class="active">Jeux</a>
      <a href="launcher.html">Launcher</a>
    </nav>
    <button class="nav-toggle" aria-label="Ouvrir le menu">☰</button>
  </div>
</header>

<main>
  <section style="padding-top: 140px;">
    <div class="wrap">
      <div class="section-head">
        <span class="eyebrow">Catalogue</span>
        <h2>Nos jeux</h2>
      </div>
      <p class="game-count">2 jeux disponibles sur le Matt Games Launcher</p>

      <div class="game-grid">
        <figure class="game-card">
          <img src="Logos/sinics.png" alt="Sinics">
          <figcaption>Sinics</figcaption>
        </figure>
        <figure class="game-card">
          <img src="Logos/house-simulator.png" alt="House Simulator">
          <figcaption>House Simulator</figcaption>
        </figure>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap footer-inner">
    <span class="brand-name">MATT GAMES</span>
    <span>© 2024 Matt Games. Tous droits réservés.</span>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
